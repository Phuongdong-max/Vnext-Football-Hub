    <title>Vnext FootballHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary, #f97316)', // Default primary color (Orange)
              secondary: 'var(--color-secondary, #475569)', // Default secondary color (Slate)
              background: 'var(--color-background, #f8f9fa)', // Default background
              surface: 'var(--color-surface, #ffffff)', // Default surface for cards, modals
              textPrimary: 'var(--color-text-primary, #212529)', // Default primary text
              textSecondary: 'var(--color-text-secondary, #495057)', // Default secondary text
              success: '#28a745',
              danger: '#dc3545',
              warning: '#ffc107', // This is a Tailwind yellow-500, often used for warnings. Could be adjusted if needed.
            },
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif; /* A nice, modern sans-serif font */
        @apply bg-background text-textPrimary;
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        @apply bg-gray-100; /* Consider var(--color-surface) or var(--color-background) */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        @apply bg-primary; /* Will now be orange */
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        @apply bg-opacity-80; /* Orange with 80% opacity */
      }
      :root {
        --color-primary: #f97316; /* Orange-500 */
        --color-secondary: #475569; /* Slate-600 */
        --color-background: #f1f5f9; /* Slate-100 */
        --color-surface: #ffffff;
        --color-text-primary: #1e293b; /* Slate-800 */
        --color-text-secondary: #475569; /* Slate-600 */
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
